name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch Linux ships the GTK 4 / libadwaita versions toktop targets.
    container: archlinux:latest
    steps:
      - name: Install system packages
        run: pacman -Syu --noconfirm --needed base-devel git rustup gtk4 libadwaita sqlite
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup default stable && rustup component add clippy rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
