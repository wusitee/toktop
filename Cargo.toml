[package]
name = "toktop"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Native Linux desktop monitor for AI coding tool token usage"
license = "MIT"
repository = "https://github.com/wusitee/toktop"

[features]
default = ["desktop", "layer-shell"]
desktop = ["dep:adw", "dep:gtk", "dep:async-channel", "dep:ksni"]
# Desktop widget on wlr-layer-shell compositors; links libgtk4-layer-shell.
layer-shell = ["desktop"]

[[bin]]
name = "toktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "toktop-collector"
path = "src/bin/collector.rs"

[dependencies]
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_6"], optional = true }
async-channel = { version = "=2.5.0", optional = true }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_12"], optional = true }
glob = "=0.3.3"
inotify = { version = "=0.11.5", default-features = false }
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"], optional = true }
memchr = "=2.8.3"
rusqlite = "=0.40.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = { version = "=1.1.8", default-features = false, features = ["std", "serde", "parse", "display"] }
ureq = { version = "=3.4.2", default-features = false, features = ["native-tls", "gzip"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
